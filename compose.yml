services:
  storage-postgres:
    image: busybox
    volumes:
      - /var/lib/postgresql/data
  storage-mysql:
    image: busybox
    volumes:
      - /var/lib/mysql

  postgres:
    image: postgres:17.6-alpine
    volumes_from:
      - storage-postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "cyqldog"
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: "cyqldogdb"
  mysql:
    image: mysql:8.0
    volumes_from:
      - storage-mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_HOST: "%"
      MYSQL_USER: "cyqldog"
      MYSQL_PASSWORD: $DB_PASSWORD
      MYSQL_DATABASE: "cyqldogdb"
  dogstatsd:
    image: datadog/dogstatsd:7.70.2
    ports:
      - "8125:8125/udp"
    environment:
      DD_API_KEY:

